# MEMAR for users. Nothing is required to start:
#
#   docker compose up -d
#   docker logs memar        # prints the one-time setup link
#
# Optional settings go in .env (see .env.example). Developers who build from
# source: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Host networking (Linux only, for LAN discovery): see docker-compose.host-network.yml.
# Requires Docker Compose 2.24+ (env_file "required" syntax).

name: memar

services:
  memar:
    # Built from this checkout (no prebuilt image is published yet).
    build: .
    image: memar:local
    pull_policy: build
    container_name: memar
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed inside the container so a MEMAR_PORT in .env cannot break the mapping below.
      MEMAR_PORT: "8000"
    # Host port: MEMAR_HOST_PORT in .env (default 8000).
    ports:
      - "${MEMAR_HOST_PORT:-8000}:8000"
    volumes:
      # One volume holds everything: database, devices.yaml, logs, jwt-secret, setup-code.
      - memar-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 768m
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  memar-data:
    name: memar-data
