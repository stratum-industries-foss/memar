# Dependabot keeps every MEMAR dependency current. Updates are grouped so one
# weekly PR per ecosystem carries the minor/patch bumps; major versions arrive as
# their own PRs. CI (.github/workflows/ci.yml) must pass before merge.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directories:
      - "/tools/print-cv"
      - "/tools/spool-cv"
      - "/tools/memar-firmware-client"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch", "major"]
