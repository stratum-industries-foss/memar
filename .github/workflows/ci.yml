name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Weekly run against the newest upstream releases, so a breaking package,
  # Python, Node or base-image release is caught before users hit it.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: backend (Python ${{ matrix.python }}, ${{ matrix.resolution }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "highest" = newest release of every dependency; "lowest-direct" = the
        # floors in requirements.txt, on the oldest supported Python.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: ["highest"]
        include:
          - python: "3.11"
            resolution: "lowest-direct"
          - python: "3.x"
            resolution: "highest"
            allow-prereleases: true
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.allow-prereleases || false }}

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies (${{ matrix.resolution }})
        run: |
          uv venv .venv --python "$(which python)"
          uv pip install --python .venv/bin/python --resolution ${{ matrix.resolution }} \
            -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q -W error::DeprecationWarning:app

  frontend:
    name: frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["lts/*", "current"]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      # Frontend unit tests are reported but not yet blocking: some tests are
      # stale after the drawer refactor and are being updated. Backend tests,
      # the TypeScript check and the build above remain required.
      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: npm run test:unit

  installer:
    name: install.sh (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "ubuntu:latest", "fedora:latest", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - name: Prepare image
        run: |
          if command -v pacman >/dev/null; then pacman -Sy --noconfirm git; fi
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq git; fi
          if command -v dnf >/dev/null; then dnf install -y -q git; fi
      - uses: actions/checkout@v7
      - name: Install (no systemd in containers)
        run: ./install.sh --no-service --port 8123
      - name: Start and probe
        run: |
          cd backend && set -a && . ../.env && set +a
          .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8123 &
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8123/api/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8123/

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          pull: true
          load: true
          tags: memar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Zero-config probe (no env, no volumes)
        run: |
          set -euo pipefail
          docker run -d --name memar-ci -p 18000:8000 memar:ci
          ok=0
          for i in $(seq 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:18000/api/readyz; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "readyz never returned 200"; docker logs memar-ci; exit 1; }
          curl -fsS http://127.0.0.1:18000/api/setup/status | tee /tmp/setup-status.json
          python3 -c 'import json,sys; d=json.load(open("/tmp/setup-status.json")); sys.exit(0 if d.get("claimed") is False else 1)'
          docker exec memar-ci memar setup-link | tee /tmp/setup-link.txt
          grep -Eq 'https?://[^[:space:]]+' /tmp/setup-link.txt
      - name: Container logs
        if: always()
        run: docker logs memar-ci || true

  rust-tools:
    name: rust tools (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build with latest compatible crates
        run: |
          for d in tools/print-cv tools/spool-cv tools/memar-firmware-client; do
            (cd "$d" && cargo update && cargo build --release)
          done

  dco-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check DCO sign-off on all commits
        run: |
          missing=0
          for sha in $(git log --no-merges --format='%H' "origin/${{ github.base_ref }}..HEAD"); do
            if ! git log -1 --format='%B' "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' trailer (DCO). See CONTRIBUTING.md#contributor-sign-off-dco."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "All commits are signed off."
