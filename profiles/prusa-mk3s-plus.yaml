# Prusa MK3S+ — Bed-slinger with PINDA probe
# Source: Prusa Research official specs + Prusa firmware (Marlin fork)
machine_type: fdm
protocol: prusa_connect  # Prusa Marlin fork + Prusa Connect
nozzle_diameter_mm: 0.4
filament_diameter_mm: 1.75
build_volume:
  x: 250.0
  y: 210.0
  z: 210.0

# PINDA probe for mesh bed leveling
probe: true
probe_type: pinda  # Inductive probe specific to Prusa
filament_sensor: true
webcam_expected: true

# Heating limits (Prusa MK3S+ with E3D Volcano)
safe_nozzle_max_c: 280.0
safe_bed_max_c: 110.0

# Prusa-specific maintenance
maintenance_interval_hours: 80
maintenance_interval_jobs: 100
maintenance_interval_filament_g: 3000

capabilities:
  quad_gantry_level: false
  mesh_bed_leveling: true  # Prusa G80 command
  manual_probe_required: false
  nozzle_cleaning_brush: true

start_gcode: |
  M83  ; Extruder relative mode
  M104 S[nozzle_temperature]
  M140 S[bed_temperature]
  M109 S[nozzle_temperature]
  M190 S[bed_temperature]
  G28 W  ; Home all axes with nozzle-checking
  G80  ; Mesh bed leveling (Prusa-specific)
  G1 X10 Y10 Z0.15 F3000

end_gcode: |
  M104 S0
  M140 S0
  G28 X Y
  G1 Z235
  M84

notes:
  - PINDA probe requires proper calibration via Prusa menu
  - G80 command specific to Prusa Marlin; not compatible with Klipper
  - Prusa Connect required for OTA updates and remote monitoring
  - Nozzle brush cleaning available on Y-min endstop
